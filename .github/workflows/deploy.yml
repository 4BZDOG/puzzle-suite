# CI & Deploy — single pipeline for Puzzle Suite.
#
#   pull_request        → run `verify` only (no deploy)
#   push to main        → verify → build → deploy to GitHub Pages
#   workflow_dispatch   → verify → build → deploy (manual run)
#
# Deploy is gated on `verify`, so a failing lint/test/build never ships.

name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:          # allows manual runs from the GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel superseded runs on the same ref (e.g. rapid pushes). Pages deploys
# are additionally serialized by the deploy job's own concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Verify ───────────────────────────────────────────────────────────────
  # Lint, test, build, and confirm the committed bundle is fresh.
  # Runs on every event, including pull requests.
  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (0 warnings allowed)
        run: npm run lint -- --max-warnings 0

      - name: Run tests
        run: npm test

      - name: Build bundle
        run: npm run build

      # The committed bundle.js must match a fresh build. A diff here means
      # someone edited JS without rebuilding (a known pitfall — see CLAUDE.md).
      - name: Verify bundle.js is committed fresh
        run: |
          if ! git diff --quiet -- bundle.js; then
            echo "::error::bundle.js is stale. Run 'bash build.sh' and commit the result."
            git diff --stat -- bundle.js
            exit 1
          fi
          echo "bundle.js is up to date."

  # ── 2. Build for Pages ──────────────────────────────────────────────────────
  # Packages the deployable artifact. Skipped on pull requests.
  build:
    name: Package Pages artifact
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run esbuild
        run: bash build.sh

      - name: Remove node_modules before packaging
        run: rm -rf node_modules   # not needed at runtime; keeps artifact small

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # serve the whole repo root as-is

  # ── 3. Deploy ───────────────────────────────────────────────────────────────
  # Publishes to GitHub Pages. Skipped on pull requests.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Serialize Pages deploys without cancelling an in-progress one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
