# Continuous Integration — runs on every PR and push to main.
# Gates code quality before the deploy workflow ships to GitHub Pages.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (0 warnings allowed)
        run: npm run lint -- --max-warnings 0

      - name: Run tests
        run: npm test

      - name: Build bundle
        run: npm run build

      # The committed bundle.js must match a fresh build. A diff here means
      # someone edited JS without rebuilding (a known pitfall — see CLAUDE.md).
      - name: Verify bundle.js is committed fresh
        run: |
          if ! git diff --quiet -- bundle.js; then
            echo "::error::bundle.js is stale. Run 'bash build.sh' and commit the result."
            git diff --stat -- bundle.js
            exit 1
          fi
          echo "bundle.js is up to date."
